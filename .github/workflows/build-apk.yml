name: Build SENTEC Gate Scanner APK

on:
  push:
    paths:
      - 'android-gate-scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./android-gate-scanner/gradlew || true

      - name: Build Debug APK with Gradle
        working-directory: ./android-gate-scanner
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Rename APK for Easy Distribution
        run: |
          mkdir -p output_apk
          find android-gate-scanner/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/SENTEC-Gate-Scanner.apk \;

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SENTEC-Gate-Scanner-APK
          path: output_apk/SENTEC-Gate-Scanner.apk
          retention-days: 30
