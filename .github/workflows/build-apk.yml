name: Build SENTEC Gate Scanner APK

on:
  push:
    paths:
      - 'android-gate-scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK with Gradle
        working-directory: ./android-gate-scanner
        run: |
          gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Distribution
        run: |
          mkdir -p output_apk
          find android-gate-scanner/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/SENTEC-Gate-Scanner-v1.1.0.apk \;
          cp output_apk/SENTEC-Gate-Scanner-v1.1.0.apk output_apk/SENTEC-Gate-Scanner.apk
          ls -la output_apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SENTEC-Gate-Scanner-APK-v1.1.0
          path: output_apk/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.1.0-apk"
          name: "SENTEC Gate Scanner App v1.1.0 (Latest APK)"
          make_latest: true
          body: |
            ### 📱 SENTEC Gate Scanner Mobile App (Version 1.1.0)
            - **No Camera Obstruction**: Full-screen transparent camera viewfinder with zero center black box.
            - **Live Photo & ID Preview**: Clean asynchronous preview with loading spinner.
            - **Competition Module & Team Display**: Prominently shows module and team name on inspection.
            - **Strict Gate & Duplicate Restrictions**: Enforces wrong gate and duplicate scan blocks.
            
            **Direct Download:** Click `SENTEC-Gate-Scanner-v1.1.0.apk` below to install directly on your Android device.
          files: output_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
