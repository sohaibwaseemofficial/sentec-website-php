name: Build SENTEC Gate Scanner APK

on:
  push:
    paths:
      - 'android-gate-scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK with Gradle
        working-directory: ./android-gate-scanner
        run: |
          gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Distribution
        run: |
          mkdir -p output_apk
          find android-gate-scanner/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/SENTEC-Gate-Scanner-v1.2.0.apk \;
          cp output_apk/SENTEC-Gate-Scanner-v1.2.0.apk output_apk/SENTEC-Gate-Scanner.apk
          ls -la output_apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SENTEC-Gate-Scanner-APK-v1.2.0
          path: output_apk/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.2.0-apk"
          name: "SENTEC Gate Scanner App v1.2.0 (Offline Hotspot & Photo Caching)"
          make_latest: true
          body: |
            ### 📱 SENTEC Gate Scanner Mobile App (Version 1.2.0)
            - **Offline Private Hotspot Sync**: Safely seeds SQLite with all approved attendee passes without JSON key crashes.
            - **Local Disk Photo Caching**: Automatically downloads and caches attendee face photos and ID cards into local app storage.
            - **Master Hub Local Media Server**: Master Hub phone serves cached photos directly to connected volunteer phones at `http://192.168.43.1:8080/media/` over WiFi with 0ms internet required!
            - **No Camera Obstruction**: Full-screen transparent camera viewfinder.
            - **Two-Step Inspection & Gating**: Volunteer decides whether to grant admission or reject.
            
            **Direct Download:** Click `SENTEC-Gate-Scanner-v1.2.0.apk` or `SENTEC-Gate-Scanner.apk` below to install directly on your Android device.
          files: output_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
